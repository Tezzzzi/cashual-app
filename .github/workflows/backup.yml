name: Database backup

# Replaces the in-process scheduler in server/backup.ts, which was not a
# scheduler at all: it kept a setTimeout and the dump in the app's memory, so a
# backup was skipped whenever the app was down — including the 24 hours around
# the 2026-09-04 data loss — and the copy died with the process anyway.
#
# Runs outside the application and outside Railway on purpose. The incident was
# triggered by a billing lapse at the Railway account level, so a copy stored on
# that same account would not have survived either.

on:
  schedule:
    # 03:15 UTC daily, matching the cadence the old in-process job intended.
    - cron: "15 3 * * *"
  workflow_dispatch: # manual run, e.g. before a migration

concurrency:
  # Never let two dumps overlap.
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Throwaway MySQL used to prove the dump actually restores. A dump that
      # has never been restored is not a backup.
      verify:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: verify
          MYSQL_DATABASE: verify
        ports: ["3307:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pverify"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Install client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client

      - name: Dump production (consistent snapshot)
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          # Connection parameters go through a mysql option file, never through a
          # shell file that gets sourced: a password containing a space, quote,
          # `$` or backtick would otherwise be re-interpreted as shell syntax —
          # breaking authentication at best, executing arbitrary code at worst.
          # The option file is written with 0600 and removed at the end.
          python3 - <<'PY'
          import os, urllib.parse as u
          d = u.urlparse(os.environ["PROD_DATABASE_URL"])
          db = d.path.lstrip("/")
          def esc(v):  # my.cnf: wrap in double quotes, escape \ and "
              return '"' + str(v).replace("\\", "\\\\").replace('"', '\\"') + '"'
          with open(os.open("/tmp/my.cnf", os.O_CREAT | os.O_WRONLY | os.O_TRUNC, 0o600), "w") as f:
              f.write("[client]\n")
              f.write(f"host={esc(d.hostname)}\n")
              f.write(f"port={d.port or 3306}\n")
              f.write(f"user={esc(u.unquote(d.username))}\n")
              f.write(f"password={esc(u.unquote(d.password))}\n")
          # The database name is needed as a plain argument. It goes to a file
          # rather than $GITHUB_ENV, which only takes effect in *later* steps —
          # reading it here would leave the variable unset in this one.
          with open("/tmp/dbname", "w") as f:
              f.write(db)
          PY

          # Quoted command substitution: the value is not re-split or re-parsed.
          MYSQL_DB="$(cat /tmp/dbname)"
          test -n "$MYSQL_DB"

          # --single-transaction takes an InnoDB-consistent snapshot without
          # locking writes. Row counts are read *inside the same dump* below
          # rather than re-queried from the live database afterwards.
          mysqldump --defaults-extra-file=/tmp/my.cnf \
            --single-transaction --routines --triggers --events \
            --set-gtid-purged=OFF \
            "$MYSQL_DB" > /tmp/backup.sql
          echo "dump bytes: $(stat -c%s /tmp/backup.sql)"
          test -s /tmp/backup.sql

      - name: Verify by restoring into a clean database
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -P 3307 -uroot -pverify verify < /tmp/backup.sql

          # Validate the restored copy on its own terms. Comparing against fresh
          # COUNT(*) queries on production was wrong: any transaction written
          # after the dump finished — i.e. ordinary use of the app — would show
          # up as a mismatch and abort the job, so no backup would ever be
          # stored. A backup must not depend on the source holding still.
          TABLES=$(mysql -h 127.0.0.1 -P 3307 -uroot -pverify --batch --skip-column-names \
                   -e "SELECT table_name FROM information_schema.tables WHERE table_schema='verify' ORDER BY table_name")
          test -n "$TABLES" || { echo "::error::restored database has no tables"; exit 1; }

          # Every table the application depends on must be present.
          for required in users transactions categories familyGroups familyGroupMembers; do
            echo "$TABLES" | grep -qx "$required" \
              || { echo "::error::required table missing from backup: $required"; exit 1; }
          done

          TOTAL=0
          for t in $TABLES; do
            # CHECK TABLE surfaces a truncated or corrupt restore.
            STATUS=$(mysql -h 127.0.0.1 -P 3307 -uroot -pverify --batch --skip-column-names \
                     -e "CHECK TABLE verify.\`$t\`" | awk '{print $NF}' | tail -1)
            [ "$STATUS" = "OK" ] || { echo "::error::CHECK TABLE failed for $t: $STATUS"; exit 1; }
            N=$(mysql -h 127.0.0.1 -P 3307 -uroot -pverify --batch --skip-column-names \
                -e "SELECT COUNT(*) FROM verify.\`$t\`")
            echo "$t: $N rows"
            TOTAL=$((TOTAL + N))
          done

          # An empty restore is a silent catastrophe: it "succeeds" while
          # preserving nothing.
          test "$TOTAL" -gt 0 || { echo "::error::restored database is empty"; exit 1; }

          # The dump must carry data, not just schema.
          grep -q "^INSERT INTO" /tmp/backup.sql \
            || { echo "::error::dump contains no INSERT statements"; exit 1; }

          echo "restore verified: ${TOTAL} rows across $(echo "$TABLES" | wc -w) tables"

      - name: Encrypt and upload to R2
        env:
          PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          KEY="cashual/$(date -u +%Y/%m/%d)/cashual-$(date -u +%Y%m%dT%H%M%SZ).sql.gz.gpg"
          # Symmetric AES256, passphrase via file descriptor so it never appears
          # in the process list or the workflow log.
          gzip -c /tmp/backup.sql \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                  --passphrase-fd 3 -o /tmp/backup.gpg 3<<<"$PASSPHRASE"
          test -s /tmp/backup.gpg
          aws s3 cp /tmp/backup.gpg "s3://$R2_BUCKET/$KEY" --endpoint-url "$R2_ENDPOINT"
          # Confirm the object exists remotely with a non-zero size, rather than
          # trusting the exit code of the upload alone.
          aws s3api head-object --bucket "$R2_BUCKET" --key "$KEY" \
            --endpoint-url "$R2_ENDPOINT" --query ContentLength --output text | tee /tmp/remote_size
          test "$(cat /tmp/remote_size)" -gt 0
          echo "uploaded $KEY"

      - name: Remove credentials from the runner
        if: always()
        run: rm -f /tmp/my.cnf /tmp/dbname /tmp/backup.sql /tmp/backup.gpg

      - name: Alert on failure
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_ALERT_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          # A backup that fails silently is worse than no backup, because it
          # buys false confidence.
          curl -sS -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            -d "chat_id=$CHAT" \
            -d "text=Cashual: DATABASE BACKUP FAILED — run ${{ github.run_id }}. No verified copy was stored today." \
            > /dev/null
